[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-v5-quantum-orchestrator"
version = "5.0.0.dev0"
description = "Quantum-classical AI orchestration runtime"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24.0"]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=2.2", "torch>=2.0"]
quantum = ["pennylane>=0.35"]
qiskit = ["qiskit>=1.0", "qiskit-ibm-runtime>=0.20"]
pytket = ["pytket>=1.20"]
test = ["pytest>=7.0", "pytest-cov>=4.1", "PyYAML>=6.0.1"]
dev = ["build>=1.2.0", "pytest>=7.0", "pytest-cov>=4.1", "PyYAML>=6.0.1"]

[project.scripts]
jarvis = "jarvis_launch:main"

[tool.setuptools]
py-modules = ["jarvis_launch", "jarvis_v5", "jarvis_vqc_layer"]

[tool.setuptools.packages.find]
include = ["jarvis*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
