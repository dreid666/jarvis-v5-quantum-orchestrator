name: JARVIS V8 CI/CD Pipeline

on:
  push:
    branches: [ build/agentic-wingman-copilot, main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.13', '3.14']
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[test]"
        pip install mypy pytest pytest-cov
    
    - name: Run type checks
      run: mypy jarvis/ --config-file=mypy.ini
      continue-on-error: true
    
    - name: Run tests
      run: pytest tests/ -v --tb=short --cov=jarvis --cov-report=xml
    
    - name: Upload coverage
      uses: codecov/codecov-action@v3
      with:
        files: ./coverage.xml
        flags: unittests
        name: codecov-umbrella

  integration-tests:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.14'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
    
    - name: Run integration tests
      run: pytest tests/test_integration_staging.py -v --tb=short
    
    - name: Collect metrics
      run: |
        python -c "from jarvis import JARVISOrchestrator; o = JARVISOrchestrator(); s = o.status(); print('Status:', s)"

  lint:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.14'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black isort
    
    - name: Check formatting
      run: black --check jarvis/ tests/
      continue-on-error: true
    
    - name: Check import sorting
      run: isort --check-only jarvis/ tests/
      continue-on-error: true
    
    - name: Run flake8
      run: flake8 jarvis/ tests/ --count --statistics
      continue-on-error: true

  security:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.14'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install bandit safety
    
    - name: Run bandit
      run: bandit -r jarvis/ -f json -o bandit-report.json
    
    - name: Check dependencies
      run: safety check --json
